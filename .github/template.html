<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="HCNews: A streamlined daily news update inspired by JRMUNEWS, featuring holidays, weather, and more.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
    <title>HCNews!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0d0d0d;
            --bg-tertiary: #1a1a1a;
            --text-primary: #d4d4d4;
            --text-secondary: #aaa;
            --text-highlight: #fff;
            --border-color: #2a2a2a;
            --accent-color: #3794ff;
            --accent-hover: #2a75d1;
            --code-bg: #0d0d0d;
            --code-color: #e06c75;
            --em-color: #aaa;
            --del-color: #888;
            --shadow-color: rgba(0, 0, 0, 0.8);
            --scrollbar-track: #0d0d0d;
            --scrollbar-thumb: #333;
        }

        [data-theme="light"] {
            --bg-primary: #faf6ea;
            --bg-secondary: #fffdf7;
            --bg-tertiary: #ece4d0;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-highlight: #000000;
            --border-color: #d8cdb2;
            --accent-color: #0066cc;
            --accent-hover: #0052a3;
            --code-bg: #f0e9d6;
            --code-color: #d63384;
            --em-color: #555555;
            --del-color: #999999;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --scrollbar-track: #ece4d0;
            --scrollbar-thumb: #c9bfa5;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 100px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ---- Newspaper masthead (Step 1 of restyle) ---- */
        .masthead {
            text-align: center;
            color: var(--text-highlight);
            margin: 6px 0 0;
        }

        .masthead-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            border-top: 3px solid var(--text-highlight);
            border-bottom: 1px solid var(--text-highlight);
            padding: 6px 2px;
            white-space: nowrap;
            overflow: hidden;
        }

        .masthead-title {
            font-family: 'UnifrakturMaguntia', 'Old English Text MT', Georgia, serif;
            font-size: clamp(56px, 13vw, 108px);
            line-height: 1;
            margin: 10px 0 12px;
            font-weight: 400;
        }

        .masthead-rule {
            border: none;
            border-bottom: 3px solid var(--text-highlight);
            margin: 0 0 16px;
        }

        @media (max-width: 600px) {
            .masthead-top {
                font-size: 9px;
                letter-spacing: 0.08em;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                padding-bottom: 80px;
            }

            .nav-tabs {
                margin-bottom: 0;
            }

            .controls {
                justify-content: space-between;
                padding: 10px 5px;
                gap: 5px;
            }

            .controls button {
                padding: 10px;
                flex: 1;
                /* Distribute space evenly */
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
            }

            /* Allow the view toggle to take more space and show text */
            #btn-view-toggle {
                flex: 2;
            }

            /* Fixed width for label to prevent jumping */
            #view-label {
                min-width: 70px;
                /* Big enough for 'Texto cru' */
                display: inline-block;
                text-align: center;
            }

            /* Compact buttons on mobile (labels visible, no icons) */
            .btn-icon-mobile {
                flex: 0 0 auto;
                /* Don't grow, just fit text */
                padding: 10px 12px;
                font-size: 11px;
            }
        }

        .nav-tabs {
            display: flex;
            border-top: 1px solid var(--text-highlight);
            border-bottom: none;
            margin-bottom: 0;
            gap: 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            flex-wrap: nowrap;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            /* Ensure content doesn't show through */
            z-index: 1000;
            padding-top: 0;
            /* Slight padding from top */
            padding-bottom: 0;
            transition: transform 0.3s ease-in-out;
        }

        .nav-hidden {
            transform: translateY(-100%);
        }

        .nav-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .nav-tabs::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        .nav-tabs::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb);
            border-radius: 4px;
        }

        .nav-tab {
            background: none;
            color: var(--text-highlight);
            padding: 10px 14px;
            text-decoration: none;
            border-radius: 0;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: background-color 0.2s, color 0.2s;
            font-size: 12px;
            white-space: nowrap;
            flex: 1 0 auto;
            /* Grow to fill space, don't shrink below content */
            text-align: center;
        }

        .nav-tab+.nav-tab {
            border-left: 1px solid var(--border-color);
        }

        .nav-tab:hover {
            color: var(--text-highlight);
        }

        .nav-tab.active {
            background-color: var(--text-highlight);
            color: var(--bg-primary);
        }

        .controls {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 3px solid var(--text-highlight);
            display: flex;
            gap: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-primary);
            z-index: 100;
            padding: 10px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 -2px 10px var(--shadow-color);
            transition: transform 0.3s ease-in-out;
        }

        .controls-hidden {
            transform: translateY(100%);
        }

        button {
            background-color: var(--text-highlight);
            color: var(--bg-primary);
            border: 1px solid var(--text-highlight);
            padding: 10px 18px;
            border-radius: 0;
            cursor: pointer;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        button:hover {
            opacity: 0.85;
        }

        button.secondary {
            background: none;
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        button.secondary:hover {
            opacity: 1;
            border-color: var(--text-highlight);
            color: var(--text-highlight);
        }

        /* Fixed width so Copiar/Copiado! doesn't shift the layout */
        #btn-copy .label {
            display: inline-block;
            min-width: calc(8ch + 1em);
            text-align: center;
        }

        /* Same for Texto cru/Visual (9 chars incl. space) */
        #view-label {
            min-width: calc(9ch + 1em);
        }

        /* Links toggle: OFF state reads as "disabled" via dashed rule + strikethrough */
        #btn-links-toggle.secondary {
            border-style: dashed;
        }

        #btn-links-toggle.secondary .label {
            text-decoration: line-through;
            opacity: 0.65;
        }

        #theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 16px;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        #theme-toggle:hover {
            background-color: var(--bg-tertiary);
        }

        #raw-content {
            width: 100%;
            height: 80vh;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            resize: vertical;
            display: none;
            box-sizing: border-box;
            font-size: 14px;
        }

        #rich-content {
            white-space: pre-wrap;
            font-size: 16px;
        }

        /* WhatsApp style formatting */
        strong {
            color: var(--text-highlight);
            font-weight: bold;
        }

        em {
            font-style: italic;
            color: var(--em-color);
        }

        del {
            text-decoration: line-through;
            color: var(--del-color);
        }

        a {
            color: var(--text-highlight);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        a:hover {
            text-decoration-thickness: 2px;
        }

        code {
            background-color: var(--code-bg);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <!-- Newspaper nameplate -->
    <header class="masthead">
        <div class="masthead-top">
            <span>Araucária &middot; Paraná</span>
            <span>{{DATE}}</span>
        </div>
        <div class="masthead-title">HCNews</div>
    </header>

    <!-- Main Navigation -->
    <nav class="nav-tabs">
        <a href="index.html" class="nav-tab" id="tab-tudo">Tudo</a>
        <a href="noticias.html" class="nav-tab" id="tab-noticias">Notícias</a>
        <a href="esportes.html" class="nav-tab" id="tab-esportes">Esportes</a>
        <a href="hackernews.html" class="nav-tab" id="tab-hackernews">Hacker News</a>
        <a href="ru.html" class="nav-tab" id="tab-ru">RU</a>
        <a href="musicchart.html" class="nav-tab" id="tab-musicchart">Música</a>
        <a href="horoscopo.html" class="nav-tab" id="tab-horoscopo">Horóscopo</a>
        <a href="weather.html" class="nav-tab" id="tab-weather">Clima</a>
    </nav>
    <hr class="masthead-rule">

    <div id="rich-content"></div>
    <textarea id="raw-content" readonly></textarea>

    <div class="controls">
        <button onclick="toggleView()" id="btn-view-toggle" title="Ver Texto cru">
            <span class="label" id="view-label">Texto cru</span>
        </button>
        <button onclick="toggleLinks()" id="btn-links-toggle" class="btn-icon-mobile" title="Mostrar links">
            <span class="label">Links</span>
        </button>
        <button onclick="copyRaw()" id="btn-copy" class="secondary btn-icon-mobile" title="Copiar texto">
            <span class="label">Copiar</span>
        </button>
        <button onclick="toggleTheme()" id="theme-toggle" class="secondary btn-icon-mobile" title="Alternar tema">
            <span id="theme-text" class="label">Escuro</span>
        </button>
    </div>

    <!-- Hidden container for the content source -->
    <script id="source-content" type="text/plain">
{{CONTENT}}
    </script>

    <script>
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function (m) { return map[m]; });
        }

        function stripLinks(text) {
            const lines = text.split(/\r?\n/);
            let inRss = false;
            const out = [];
            for (let i = 0; i < lines.length; i++) {
                let l = lines[i];
                l = l.replace(/\s+$/g, '');
                if (/^\s*📰\s+/.test(l)) {
                    inRss = true;
                    out.push(l);
                    continue;
                }
                if (inRss && (/^[^\s-]/.test(l) && !/^\s*[-–—]/.test(l) || /^\s*🚫/.test(l) || /^\s*🔔/.test(l) || /^\s*🤖/.test(l) || /^\s*🤝/.test(l))) {
                    inRss = false;
                }
                if (inRss) {
                    if (/^\s*https?:\/\//i.test(l)) continue;
                    if (/^\s*[-–—]\s.*\shttps?:\/\//i.test(l)) {
                        l = l.replace(/\shttps?:\/\/\S+\s*$/i, '');
                    }
                }
                out.push(l);
            }
            return out.join('\n');
        }

        function parseWhatsApp(text, showLinks = true) {
            if (!showLinks) text = stripLinks(text);
            let parsed = escapeHtml(text);
            parsed = parsed.replace(/```([^`]+)```/g, '<pre><code>$1</code></pre>');
            parsed = parsed.replace(/`([^`]+)`/g, '<code>$1</code>');
            parsed = parsed.replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>');
            parsed = parsed.replace(/_([^_]+)_/g, '<em>$1</em>');
            parsed = parsed.replace(/~([^~\n]+)~/g, '<del>$1</del>');
            const titleInlineRegex = /-\s+([^\n\r]*?[a-zA-Z0-9][^\n\r]*?)\s+(https?:\/\/[^\s]+)/g;
            parsed = parsed.replace(titleInlineRegex, '- <a href="$2" target="_blank">$1</a>');
            const titlePairRegex = /^-\s+([^\n\r]+)\r?\n\s+(https?:\/\/[^\s]+)/gm;
            parsed = parsed.replace(titlePairRegex, '- <a href="$2" target="_blank">$1</a>');
            const mdLinkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
            parsed = parsed.replace(mdLinkRegex, '<a href="$2" target="_blank">$1</a>');
            const urlRegex = /(^|\s)(https?:\/\/[^\s]+)/g;
            parsed = parsed.replace(urlRegex, '$1<a href="$2" target="_blank">$2</a>');
            return parsed;
        }



        function renderContent(text, showLinks) {
            return parseWhatsApp(text, showLinks);
        }

        let linksVisible = true;

        function toggleLinks() {
            linksVisible = !linksVisible;
            const btn = document.getElementById('btn-links-toggle');
            btn.classList.toggle('secondary', !linksVisible);
            btn.title = linksVisible ? 'Ocultar links' : 'Mostrar links';
            const currentView = document.getElementById('rich-content').style.display !== 'none' ? 'rich' : 'raw';
            setView(currentView);
        }

        function setView(view) {
            const richDiv = document.getElementById('rich-content');
            const rawArea = document.getElementById('raw-content');

            // Toggle Button Elements
            const viewLabel = document.getElementById('view-label');
            const viewBtn = document.getElementById('btn-view-toggle');

            const showLinks = linksVisible;

            if (view === 'rich') {
                richDiv.style.display = 'block';
                rawArea.style.display = 'none';

                // Set button to show option for NEXT state (Raw)
                viewLabel.textContent = 'Texto cru';
                viewBtn.title = 'Ver Texto cru';
            } else {
                richDiv.style.display = 'none';
                rawArea.style.display = 'block';

                // Set button to show option for NEXT state (Visual)
                viewLabel.textContent = 'Visual';
                viewBtn.title = 'Ver Visual';
            }

            // Render content
            const sourceEl = document.getElementById('source-content');
            const sourceText = sourceEl.textContent.replace(/^\n/, ''); // Clean leading newline

            document.getElementById('raw-content').value = showLinks ? sourceText : stripLinks(sourceText);
            document.getElementById('rich-content').innerHTML = renderContent(sourceText, showLinks);
        }

        function toggleView() {
            const richDiv = document.getElementById('rich-content');
            const currentView = richDiv.style.display !== 'none' ? 'rich' : 'raw';
            const newView = currentView === 'rich' ? 'raw' : 'rich';
            setView(newView);
        }

        function copyRaw() {
            const rawText = document.getElementById('raw-content');
            const wasHidden = rawText.style.display === 'none';
            if (wasHidden) {
                rawText.style.display = 'block';
                rawText.style.opacity = '0';
                rawText.style.position = 'absolute';
            }
            const showLinks = linksVisible;
            const textToCopy = showLinks ? rawText.value : stripLinks(rawText.value);
            try { rawText.select(); rawText.setSelectionRange(0, 99999); } catch (e) { }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.querySelector('button[onclick="copyRaw()"]');
                const label = btn.querySelector('.label');
                const originalText = label.textContent;
                label.textContent = "Copiado!";
                setTimeout(() => label.textContent = originalText, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            }).finally(() => {
                if (wasHidden) {
                    rawText.style.display = 'none';
                    rawText.style.opacity = '';
                    rawText.style.position = '';
                }
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const text = document.getElementById('theme-text');
            if (theme === 'light') {
                text.textContent = 'Claro';
            } else {
                text.textContent = 'Escuro';
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateThemeUI(savedTheme);
            } else {
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = systemDark ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                updateThemeUI(theme);
            }
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) {
                const theme = e.matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                updateThemeUI(theme);
            }
        });

        // Initialize
        window.onload = function () {
            initTheme();

            // Highlight active tab
            const path = window.location.pathname;
            const page = path.split('/').pop() || 'index.html';
            // Default to index if empty path (root)
            const activePage = (page === '' || page === 'index.html' || page === 'hcnews') ? 'index.html' : page;

            // Match tab
            if (activePage === 'index.html') document.getElementById('tab-tudo').classList.add('active');
            else if (activePage === 'noticias.html') document.getElementById('tab-noticias').classList.add('active');
            else if (activePage === 'esportes.html') document.getElementById('tab-esportes').classList.add('active');
            else if (activePage === 'hackernews.html') document.getElementById('tab-hackernews').classList.add('active');
            else if (activePage === 'ru.html') document.getElementById('tab-ru').classList.add('active');
            else if (activePage === 'musicchart.html') document.getElementById('tab-musicchart').classList.add('active');
            else if (activePage === 'horoscopo.html') document.getElementById('tab-horoscopo').classList.add('active');
            else if (activePage === 'weather.html') document.getElementById('tab-weather').classList.add('active');

            const sourceEl = document.getElementById('source-content');
            let cleanText = sourceEl.textContent.replace(/^\n/, '');
            // Update source with clean text
            sourceEl.textContent = cleanText;

            // Render
            setView('rich');

            // Scroll Logic for Bottom Bar and Navbar
            let lastScrollTop = 0;
            const controls = document.querySelector('.controls');
            const navTabs = document.querySelector('.nav-tabs');

            window.addEventListener('scroll', function () {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    // Scroll Down
                    controls.classList.add('controls-hidden');
                    navTabs.classList.add('nav-hidden');
                } else {
                    // Scroll Up
                    controls.classList.remove('controls-hidden');
                    navTabs.classList.remove('nav-hidden');
                }
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; // For Mobile or negative scrolling
            }, { passive: true });

            // Restore Navbar Scroll Position
            const savedScroll = sessionStorage.getItem('navScrollLeft');
            if (savedScroll) {
                navTabs.scrollLeft = savedScroll;
            }

            // Save Navbar Scroll Position
            navTabs.addEventListener('scroll', () => {
                sessionStorage.setItem('navScrollLeft', navTabs.scrollLeft);
            }, { passive: true });
        };
    </script>
</body>

</html>
